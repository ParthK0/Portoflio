<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tech Stack Globe</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#07070a;--fg:#f1f1f3;--muted:#8a8a94;--line:#26262e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:'Outfit',system-ui,sans-serif;overflow:hidden}
#stage{position:relative;width:100%;height:100%;overflow:hidden;user-select:none;-webkit-user-select:none;cursor:grab;touch-action:none}
#stage.drag{cursor:grabbing}
#bg{position:absolute;inset:0;width:100%;height:100%}
.spot{position:absolute;inset:0;background:radial-gradient(520px circle at var(--mx,50%) var(--my,50%),rgba(99,102,241,.16),transparent 60%);pointer-events:none}
.glow{position:absolute;left:50%;top:50%;width:80vmin;height:80vmin;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(99,102,241,.32),rgba(99,102,241,.08) 45%,transparent 70%);pointer-events:none}
.ring{position:absolute;left:50%;top:50%;border-radius:50%;aspect-ratio:1;border:1px dashed rgba(165,168,255,.3);pointer-events:none;animation:spin 24s linear infinite}
.r1{width:min(34vmin,280px)}.r2{width:min(46vmin,380px);animation-direction:reverse;animation-duration:36s;border-style:dotted}
@keyframes spin{from{transform:translate(-50%,-50%) rotate(0)}to{transform:translate(-50%,-50%) rotate(360deg)}}
.orb{position:absolute;left:50%;top:50%;width:min(22vmin,180px);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;
background:radial-gradient(circle at 35% 30%,#d4d6ff 0,#7c80f5 38%,#4547d6 100%);box-shadow:0 0 90px rgba(99,102,241,.7),inset 0 0 40px rgba(255,255,255,.25);pointer-events:none;animation:pulse 4s ease-in-out infinite}
@keyframes pulse{50%{transform:translate(-50%,-50%) scale(1.06)}}
.title{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;font-weight:800;font-size:clamp(14px,2.6vmin,26px);letter-spacing:.16em;line-height:1.15;pointer-events:none;z-index:1;
background:linear-gradient(90deg,#fff,#c9cbff,#fff);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 4s linear infinite;filter:drop-shadow(0 2px 14px rgba(30,32,120,.8))}
@keyframes sh{to{background-position:200% 0}}
.item{position:absolute;left:0;top:0;white-space:nowrap;cursor:pointer;font-weight:800;letter-spacing:-.02em;font-size:clamp(18px,2.6vw,32px);color:var(--fg);
transition:color .25s,text-shadow .25s,filter .25s;will-change:transform,opacity;-webkit-tap-highlight-color:transparent}
.item.active{color:hsl(var(--h) 100% 80%);text-shadow:0 0 28px hsl(var(--h) 100% 60%/.95),0 0 60px hsl(var(--h) 100% 55%/.5)}
.item.dim{filter:blur(1.6px)}
#panel{position:absolute;width:min(310px,calc(100% - 24px));background:linear-gradient(160deg,rgba(26,26,34,.95),rgba(14,14,18,.95));border:1px solid hsl(var(--h) 80% 60%/.4);border-radius:18px;padding:16px 18px 18px;
backdrop-filter:blur(12px);box-shadow:0 24px 70px rgba(0,0,0,.65),0 0 50px hsl(var(--h) 90% 60%/.22);opacity:0;pointer-events:none;transform:translateY(-10px) scale(.9);transition:opacity .25s,transform .25s;z-index:20;overflow:hidden}
#panel::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,transparent,hsl(var(--h) 100% 70%),transparent)}
#panel.show{opacity:1;pointer-events:auto;transform:none}
#panel h3{margin:0 0 12px;font-size:18px;font-weight:700;display:flex;align-items:center;gap:8px;color:hsl(var(--h) 100% 85%)}
#panel h3 span{font-size:11px;color:hsl(var(--h) 100% 82%);background:hsl(var(--h) 80% 55%/.2);border-radius:99px;padding:2px 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--fg);border:1px solid hsl(var(--h) 60% 55%/.4);background:hsl(var(--h) 60% 50%/.12);border-radius:8px;padding:5px 10px;opacity:0;transform:translateY(8px) scale(.9);animation:in .35s cubic-bezier(.2,.9,.3,1.3) forwards}
@keyframes in{to{opacity:1;transform:none}}
.hint{position:absolute;bottom:18px;left:0;right:0;text-align:center;font-size:12px;color:var(--muted);letter-spacing:.16em;text-transform:uppercase;pointer-events:none;animation:fade 2s 1.5s both}
@keyframes fade{from{opacity:0}}
</style>
</head>
<body>
<div id="stage">
  <canvas id="bg"></canvas><div class="spot"></div><div class="glow"></div>
  <div class="ring r1"></div><div class="ring r2"></div>
  <div class="orb"></div><div class="title">TECH<br>STACK</div>
  <div id="panel"><h3><b id="pt"></b><span id="pc"></span></h3><div class="chips" id="pchips"></div></div>
  <div class="hint">Drag to spin · hover or tap a heading</div>
</div>
<script>
const DATA=[
["Programming Languages",["Java","Python","C","C++","TypeScript","SQL"],245],
["ML & Computer Vision",["OpenCV","FaceNet","LBPH","Scikit-learn"],160],
["Web & Frontend",["React","Next.js","HTML","CSS","Tailwind CSS"],195],
["Backend & Databases",["Node.js","Express.js","FastAPI","Prisma","PostgreSQL","MySQL","Redis"],140],
["AI, Multi-Agent & Real-Time",["Gemini API","Claude AI","LangGraph","WebSocket","Agora","Firecrawl"],285],
["Coursework",["DSA","Computer Vision","DBMS","OOP","Probability & Statistics","Operating Systems","Linear Algebra"],40],
["Tools & Platforms",["Git","GitHub","Maven","Firebase"],18],
["Soft Skills",["Teamwork","Communication","Leadership","Adaptability"],330]];
const stage=document.getElementById('stage'),panel=document.getElementById('panel'),cv=document.getElementById('bg'),ctx=cv.getContext('2d');
const n=DATA.length,pts=[],els=[],boost=Array(n).fill(0);
for(let i=0;i<n;i++){const y=0.9-(i/(n-1))*1.8,r=Math.sqrt(1-y*y),th=i*2.399963;pts.push([Math.cos(th)*r,y,Math.sin(th)*r]);
const d=document.createElement('div');d.className='item';d.textContent=DATA[i][0];d.style.setProperty('--h',DATA[i][2]);stage.appendChild(d);els.push(d)}
const pairs=[];for(let i=0;i<n;i++){const o=pts.map((p,j)=>[j,p[0]*pts[i][0]+p[1]*pts[i][1]+p[2]*pts[i][2]]).filter(a=>a[0]!==i).sort((a,b)=>b[1]-a[1]).slice(0,2);
o.forEach(([j])=>{if(!pairs.some(p=>(p[0]===i&&p[1]===j)||(p[0]===j&&p[1]===i)))pairs.push([i,j])})}
const SD=[];for(let i=0;i<280;i++){const y=1-(i/279)*2,r=Math.sqrt(1-y*y),th=i*2.399963;SD.push([Math.cos(th)*r,y,Math.sin(th)*r])}
const stars=Array.from({length:130},()=>({x:Math.random(),y:Math.random(),r:Math.random()*1.2+.2,p:Math.random()*6,s:Math.random()*.002+.0005}));
let yaw=0,pitch=0.3,ivy=0,ivp=0,moved=false,dragging=false,hover=-1,pinned=-1,timer=null,W=0,H=0,dpr=1,last=performance.now(),t0=last,mx=0,my=0;
const slow=matchMedia('(prefers-reduced-motion: reduce)').matches?.3:1;
function size(){W=stage.clientWidth;H=stage.clientHeight;dpr=Math.min(devicePixelRatio||1,2);cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
size();addEventListener('resize',()=>{size();if(open()>=0)place(open())});
const open=()=>pinned>=0?pinned:hover;
const P=pts.map(()=>({x:0,y:0,k:0}));
function frame(t){const dt=Math.min(t-last,50);last=t;
const e0=Math.min(1,(t-t0)/2000),e=1-Math.pow(1-e0,3);
if(!dragging&&open()<0){yaw+=dt*(0.00018*slow+ivy+(1-e)*0.004);pitch+=dt*(0.00007*slow+ivp);ivy*=0.95;ivp*=0.95}
const Rx=Math.min(W*0.4,520),Ry=Math.min(H*0.38,320),cy=Math.cos(yaw),sy=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch),cx=W/2,cyy=H/2,a=open();
ctx.clearRect(0,0,W,H);
for(const s of stars){const al=.25+.6*Math.abs(Math.sin(t*s.s+s.p));ctx.fillStyle=`rgba(200,205,255,${al})`;
ctx.fillRect(s.x*W+mx*s.r*12,s.y*H+my*s.r*12,s.r,s.r)}
for(const [x,y,z] of SD){const x1=x*cy+z*sy,z1=-x*sy+z*cy,y2=y*cp-z1*sp,z2=y*sp+z1*cp,k=(z2+1)/2;
ctx.fillStyle=`rgba(140,146,255,${(.05+.5*k*k)*e})`;ctx.beginPath();ctx.arc(cx+x1*Rx*e,cyy+y2*Ry*e,.5+1.3*k,0,6.283);ctx.fill()}
for(let i=0;i<n;i++){const[x,y,z]=pts[i];
const x1=x*cy+z*sy,z1=-x*sy+z*cy,y2=y*cp-z1*sp,z2=y*sp+z1*cp,k=(z2+1)/2,s=0.7+0.45*k;
const px=cx+x1*Rx*e,py=cyy+y2*Ry*e;P[i].x=px;P[i].y=py;P[i].k=k;
boost[i]+=((i===a?1:0)-boost[i])*0.15;
els[i].style.transform=`translate(${px}px,${py}px) translate(-50%,-50%) scale(${(s*(1+.2*boost[i])).toFixed(3)})`;
els[i].style.opacity=((0.22+0.78*k)*e).toFixed(3);
els[i].style.zIndex=Math.round(k*10);
els[i].style.pointerEvents=z2<-0.25?'none':'auto'}
ctx.lineWidth=1;
for(const[i,j]of pairs){const al=.16*(P[i].k+P[j].k)*e;ctx.strokeStyle=`rgba(140,146,255,${al})`;ctx.beginPath();ctx.moveTo(P[i].x,P[i].y);ctx.lineTo(P[j].x,P[j].y);ctx.stroke()}
if(a>=0){const h=DATA[a][2],g=ctx.createLinearGradient(cx,cyy,P[a].x,P[a].y);g.addColorStop(0,`hsla(${h},100%,70%,.0)`);g.addColorStop(1,`hsla(${h},100%,70%,.9)`);
ctx.strokeStyle=g;ctx.lineWidth=2;ctx.shadowColor=`hsl(${h},100%,65%)`;ctx.shadowBlur=14;ctx.beginPath();ctx.moveTo(cx,cyy);ctx.lineTo(P[a].x,P[a].y);ctx.stroke();ctx.shadowBlur=0}
requestAnimationFrame(frame)}
requestAnimationFrame(frame);
function place(i){const sr=stage.getBoundingClientRect(),hr=els[i].getBoundingClientRect(),pw=panel.offsetWidth,ph=panel.offsetHeight;
let l=hr.left-sr.left+hr.width/2-pw/2,tp=hr.top-sr.top+hr.height+12;
if(tp+ph>H-8)tp=hr.top-sr.top-ph-12;
l=Math.max(12,Math.min(W-pw-12,l));tp=Math.max(12,Math.min(H-ph-12,tp));panel.style.left=l+'px';panel.style.top=tp+'px'}
function render(){const i=open();els.forEach((x,j)=>{x.classList.toggle('active',j===i);x.classList.toggle('dim',i>=0&&j!==i)});
if(i<0){panel.classList.remove('show');return}
panel.style.setProperty('--h',DATA[i][2]);
document.getElementById('pt').textContent=DATA[i][0];document.getElementById('pc').textContent=DATA[i][1].length;
document.getElementById('pchips').innerHTML=DATA[i][1].map((s,k)=>`<span class="chip" style="animation-delay:${k*55}ms">${s.replace(/&/g,'&amp;')}</span>`).join('');
place(i);panel.classList.add('show')}
function enter(i){clearTimeout(timer);if(hover!==i){hover=i;render()}}
function leave(){clearTimeout(timer);timer=setTimeout(()=>{hover=-1;render()},260)}
els.forEach((x,i)=>{x.addEventListener('mouseenter',()=>enter(i));x.addEventListener('mouseleave',leave);
x.addEventListener('click',ev=>{ev.stopPropagation();if(moved)return;pinned=pinned===i?-1:i;hover=i;render()})});
panel.addEventListener('mouseenter',()=>clearTimeout(timer));panel.addEventListener('mouseleave',leave);
stage.addEventListener('click',()=>{if(moved)return;pinned=-1;hover=-1;render()});
let sx=0,sy0=0,lx=0,ly=0,lt=0;
stage.addEventListener('pointerdown',e=>{if(panel.contains(e.target))return;dragging=true;moved=false;sx=lx=e.clientX;sy0=ly=e.clientY;lt=performance.now();ivy=ivp=0});
addEventListener('pointermove',e=>{
mx=e.clientX/W-.5;my=e.clientY/H-.5;stage.style.setProperty('--mx',e.clientX+'px');stage.style.setProperty('--my',e.clientY+'px');
if(!dragging)return;
if(!moved&&Math.hypot(e.clientX-sx,e.clientY-sy0)>6){moved=true;stage.classList.add('drag');pinned=-1;hover=-1;render()}
if(!moved)return;const now=performance.now(),d=Math.max(now-lt,8),dx=e.clientX-lx,dy=e.clientY-ly,c=v=>Math.max(-.004,Math.min(.004,v));
yaw+=dx*0.006;pitch-=dy*0.006;ivy=c(dx*0.006/d);ivp=c(-dy*0.006/d);lx=e.clientX;ly=e.clientY;lt=now});
const up=()=>{dragging=false;stage.classList.remove('drag')};addEventListener('pointerup',up);addEventListener('pointercancel',up);
</script>
</body>
</html>
